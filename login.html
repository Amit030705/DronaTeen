<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DronTeen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f8f9fa, #e1f7e3); }
        .login-container { width: 100%; max-width: 400px; padding: 20px; }
        .login-box { background: white; border-radius: 28px; padding: 35px; box-shadow: 0 20px 35px rgba(0,0,0,0.1); text-align: center; }
        .logo { font-size: 32px; font-weight: bold; color: #0c831f; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group input { width: 100%; padding: 12px; border-radius: 40px; border: 1px solid #ddd; }
        .login-submit-btn { background: #0c831f; color: white; border: none; padding: 12px; border-radius: 40px; width: 100%; font-weight: bold; cursor: pointer; }
        .error-message, .login-error { color: #dc3545; font-size: 14px; display: none; margin-top: 5px; }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="logo"><i class="fas fa-bolt"></i> DronTeen</div>
            <h2>Welcome Back</h2>
            <form id="login-form">
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email address" required>
                    <span class="error-message" id="email-error"></span>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                    <span class="error-message" id="password-error"></span>
                </div>
                <button type="submit" class="login-submit-btn">Login</button>
                <div id="login-error" class="login-error"></div>
            </form>
            <p style="margin-top: 20px;">New to DronTeen? <a href="#" id="registerLink">Create account</a></p>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
