<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DronTeen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-container">
    <div class="logo" style="text-align:center; font-size:32px; margin-bottom:20px;"><i class="fas fa-bolt"></i> DronTeen</div>
    <h2>Welcome Back</h2>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email address" required>
        <div class="error-message" id="emailError"></div>
        <input type="password" id="password" placeholder="Password" required>
        <div class="error-message" id="passwordError"></div>
        <button type="submit">Login</button>
        <div class="error-message" id="loginError" style="text-align:center; margin-top:10px;"></div>
    </form>
    <div class="login-link">New to DronTeen? <a href="register.html">Create account</a></div>
</div>
<script src="login.js"></script>
</body>
</html>
