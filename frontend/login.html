<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DronTeen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="logo"><i class="fas fa-bolt"></i> <span>DronTeen</span></div>
        <h2>Welcome Back</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <input type="email" id="email" placeholder="Email address" required>
                <div class="error-message" id="emailError"></div>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
                <div class="error-message" id="passwordError"></div>
            </div>
            <button type="submit">Login to Account</button>
            <div class="error-message" id="loginError" style="text-align:center; margin-top:10px;"></div>
        </form>
        
        <div style="margin: 25px 0; display: flex; align-items: center; gap: 10px; color: #94a3b8;">
            <hr style="flex: 1; border: none; border-top: 1px solid #f1f5f9;">
            <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Secure Login</span>
            <hr style="flex: 1; border: none; border-top: 1px solid #f1f5f9;">
        </div>

        <div id="g_id_onload"
             data-client_id="683515478619-87m4fmob377i4bs9d9l5q5no24i3pkdi.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="google-btn-wrapper">
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="pill"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left"
                 data-width="340">
            </div>
        </div>

        <div class="login-link">New to DronTeen? <a href="register.html">Create account</a></div>
    </div>
    <script src="login.js"></script>
</body>
</html>
