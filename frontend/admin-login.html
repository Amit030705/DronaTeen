<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - DronTeen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { 
            background: #0f172a; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .auth-container { 
            width: 400px; 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px; 
            padding: 50px 40px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            color: white;
        }
        .logo { 
            text-align: center; 
            font-size: 32px; 
            color: #0c831f; 
            margin-bottom: 10px; 
            font-weight: 800;
        }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 35px; font-size: 0.9rem; }
        
        input { 
            width: 100%; 
            padding: 16px 24px; 
            margin-bottom: 20px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }
        input:focus { 
            outline: none; 
            background: rgba(255,255,255,0.1); 
            border-color: #0c831f;
            box-shadow: 0 0 0 4px rgba(12,131,31,0.1);
        }
        
        button { 
            width: 100%; 
            background: #0c831f; 
            color: white; 
            padding: 16px; 
            border-radius: 20px; 
            border: none; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 1rem;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(12,131,31,0.2);
        }
        button:hover { 
            background: #0a6e1a; 
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(12,131,31,0.3);
        }
        
        .error { 
            color: #ef4444; 
            text-align: center; 
            margin-top: 20px; 
            font-size: 13px; 
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 12px;
            display: none; 
        }
        .back-link { text-align: center; margin-top: 25px; font-size: 0.9rem; }
        .back-link a { color: #94a3b8; text-decoration: none; transition: 0.2s; }
        .back-link a:hover { color: white; }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="logo"><i class="fas fa-shield-alt"></i> DronTeen</div>
    <div class="subtitle">Secure Administrator Gateway</div>
    
    <form id="adminLoginForm">
        <input type="email" id="email" placeholder="Admin Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Unlock Dashboard</button>
        <div id="loginError" class="error"></div>
    </form>

    <div class="back-link">
        <a href="/index.html"><i class="fas fa-arrow-left"></i> Back to Homepage</a>
    </div>
</div>
<script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('loginError');
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.success && data.user.role === 'admin') {
                localStorage.setItem('adminToken', data.token);
                localStorage.setItem('adminEmail', email);
                window.location.href = '/admin.html';
            } else {
                errorDiv.textContent = 'Admin access only. Invalid credentials.';
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            errorDiv.textContent = 'Server error';
            errorDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
