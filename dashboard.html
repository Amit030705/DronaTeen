<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DronTeen | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard-container">
    <aside class="sidebar">
        <div class="logo"><i class="fas fa-bolt"></i><span>DronTeen</span></div>
        <div class="nav-item active" data-tab="overview"><i class="fas fa-chart-line"></i><span>Dashboard</span></div>
        <div class="nav-item" data-tab="orders"><i class="fas fa-shopping-bag"></i><span>My Orders</span></div>
        <div class="nav-item" data-tab="transactions"><i class="fas fa-exchange-alt"></i><span>Transactions</span></div>
        <div class="nav-item" data-tab="settings"><i class="fas fa-user-cog"></i><span>Settings</span></div>
        <div class="nav-item" id="shopNowBtn"><i class="fas fa-store"></i><span>Shop Now</span></div>
        <div class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
    </aside>

    <main class="main-content">
        <div class="top-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1>Welcome, <span id="userName">—</span></h1>
            <div class="user-card" style="background: white; padding: 8px 20px; border-radius: 40px;"><i class="fas fa-envelope"></i> <span id="userEmail"></span> <i class="fas fa-power-off logout-icon" id="logoutIcon" style="color:#dc3545; cursor:pointer; margin-left:12px;"></i></div>
        </div>

        <div id="overviewSection">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-title">Total Orders</div><div class="stat-value" id="totalOrders">0</div></div>
                <div class="stat-card"><div class="stat-title">Total Spent (₹)</div><div class="stat-value" id="totalSpent">0</div></div>
                <div class="stat-card"><div class="stat-title">Completed</div><div class="stat-value" id="completedOrders">0</div></div>
                <div class="stat-card"><div class="stat-title">Pending</div><div class="stat-value" id="pendingOrders">0</div></div>
            </div>
            <div class="two-col">
                <div class="glass-card"><div class="section-title">📊 Monthly Spend</div><canvas id="spendChart" height="200"></canvas></div>
                <div class="glass-card"><div class="section-title">🕒 Recent Transactions</div><div id="recentTxns">Loading...</div></div>
            </div>
            <div class="glass-card"><div class="section-title">📦 Purchase History</div><div id="purchaseHistory" class="order-history-list">Loading...</div></div>
        </div>

        <div id="ordersSection" style="display:none;"><div class="glass-card"><div class="section-title">All Orders <input type="text" id="searchOrders" placeholder="Search product..." style="padding:6px 12px; border-radius:20px;"></div><div id="allOrdersList"></div></div></div>
        <div id="transactionsSection" style="display:none;"><div class="glass-card"><div class="section-title">💰 Transaction Ledger</div><td><thead><tr><th>Order ID</th><th>Date</th><th>Amount</th><th>Type</th></tr></thead><tbody id="txnTableBody"></tbody></table></div></div>
        <div id="settingsSection" style="display:none;"><div class="glass-card"><div class="section-title">Account Settings</div><form id="settingsForm" class="settings-form"><div class="form-group"><label>Full Name</label><input type="text" id="fullName" required></div><div class="form-group"><label>Email</label><input type="email" id="emailSettings" required></div><div class="form-group"><label>New Password</label><input type="password" id="newPassword" placeholder="Leave blank to keep"></div><div class="form-group"><label>Address</label><input type="text" id="addressInput"></div><div class="form-group"><label>Preferred Payment</label><input type="text" id="prefPaymentInput"></div><button type="submit" class="save-btn">Update Profile</button></form></div></div>
    </main>
</div>
<script>
    const API_BASE = '';
    let token = localStorage.getItem('droneToken');
    if (!token) window.location.href = '/login.html';
    let chartInstance = null;

    async function fetchAPI(endpoint, options = {}) {
        const res = await fetch(endpoint, {
            ...options,
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers }
        });
        if (res.status === 401) { localStorage.removeItem('droneToken'); window.location.href = '/login.html'; throw new Error('Unauth'); }
        return res.json();
    }

    async function loadDashboard() {
        try {
            const profile = await fetchAPI('/api/user/profile');
            if (profile.success) {
                const u = profile.user;
                document.getElementById('userName').innerText = u.name || u.email.split('@')[0];
                document.getElementById('userEmail').innerText = u.email;
                document.getElementById('fullName').value = u.name || '';
                document.getElementById('emailSettings').value = u.email;
                document.getElementById('addressInput').value = u.address || 'Greater Noida, Noida';
                document.getElementById('prefPaymentInput').value = u.prefPayment || 'UPI';
            }
            const ordersRes = await fetchAPI('/api/user/orders');
            if (ordersRes.success) {
                const orders = ordersRes.orders;
                document.getElementById('totalOrders').innerText = orders.length;
                const totalSpent = orders.reduce((s,o)=>s+(o.total||0),0);
                document.getElementById('totalSpent').innerText = '₹' + totalSpent;
                document.getElementById('completedOrders').innerText = orders.filter(o=>o.status==='confirmed').length;
                document.getElementById('pendingOrders').innerText = orders.filter(o=>o.status==='pending').length;

                let txnHtml = '<table width="100%"><tr><th>Order ID</th><th>Date</th><th>Amount</th></tr>';
                orders.slice(0,5).forEach(o => txnHtml += `<tr><td>${o.orderId}</td><td>${new Date(o.createdAt).toLocaleDateString()}</td><td>₹${o.total}</td></tr>`);
                document.getElementById('recentTxns').innerHTML = txnHtml + '</table>';

                let historyHtml = '';
                orders.forEach(o => {
                    let itemsList = o.items.map(i => `${i.name} x${i.quantity}`).join(', ');
                    historyHtml += `<div class="history-item"><div><strong>${o.orderId}</strong><br>${new Date(o.createdAt).toLocaleString()}<br>${itemsList}</div><div>₹${o.total}<br><button class="reorder-btn" data-items='${JSON.stringify(o.items)}'>Reorder</button></div></div>`;
                });
                document.getElementById('purchaseHistory').innerHTML = historyHtml || '<p>No orders yet</p>';
                document.querySelectorAll('.reorder-btn').forEach(btn => btn.addEventListener('click', () => { localStorage.setItem('reorderCart', btn.getAttribute('data-items')); window.location.href = '/index.html'; }));
                renderFullOrders(orders);

                const monthMap = new Map();
                orders.forEach(o => { let m = new Date(o.createdAt).toLocaleString('default', { month: 'short' }); monthMap.set(m, (monthMap.get(m)||0)+(o.total||0)); });
                const labels = [...monthMap.keys()].slice(-6), data = labels.map(l=>monthMap.get(l));
                if (chartInstance) chartInstance.destroy();
                const ctx = document.getElementById('spendChart').getContext('2d');
                chartInstance = new Chart(ctx, { type: 'line', data: { labels, datasets: [{ label: 'Spending (₹)', data, borderColor: '#0c831f', fill: true, backgroundColor: 'rgba(12,131,31,0.1)' }] } });
            }
            const txnRes = await fetchAPI('/api/user/transactions');
            if (txnRes.success) {
                let tbody = '';
                txnRes.transactions.forEach(t => tbody += `<tr><td>${t.orderId}</td><td>${new Date(t.createdAt).toLocaleDateString()}</td><td>₹${t.amount}</td><td>${t.type}</td></tr>`);
                document.getElementById('txnTableBody').innerHTML = tbody || '<tr><td colspan="4">No transactions</td></tr>';
            }
        } catch(e) { console.error(e); }
    }
    function renderFullOrders(orders) {
        const container = document.getElementById('allOrdersList');
        if(!container) return;
        container.innerHTML = orders.map(o => `<div class="history-item"><div><strong>${o.orderId}</strong><br>${new Date(o.createdAt).toLocaleString()}<br>${o.items.map(i=>`${i.name} x${i.quantity}`).join(', ')}</div><div>₹${o.total}<br><span class="status-badge">${o.status}</span></div></div>`).join('');
    }
    document.getElementById('searchOrders')?.addEventListener('input', async (e) => {
        const term = e.target.value.toLowerCase();
        const res = await fetchAPI('/api/user/orders');
        if (res.success) renderFullOrders(res.orders.filter(o => o.items.some(i => i.name.toLowerCase().includes(term))));
    });
    document.getElementById('settingsForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = { name: document.getElementById('fullName').value, email: document.getElementById('emailSettings').value, address: document.getElementById('addressInput').value, prefPayment: document.getElementById('prefPaymentInput').value };
        const pwd = document.getElementById('newPassword').value;
        if (pwd.trim()) payload.password = pwd;
        const res = await fetchAPI('/api/user/profile', { method: 'PUT', body: JSON.stringify(payload) });
        if(res.success) alert('Profile updated'); else alert('Update failed');
    });
    const tabs = document.querySelectorAll('.nav-item[data-tab]');
    const sections = { overview: 'overviewSection', orders: 'ordersSection', transactions: 'transactionsSection', settings: 'settingsSection' };
    tabs.forEach(tab => tab.addEventListener('click', () => { Object.values(sections).forEach(sec => document.getElementById(sec).style.display = 'none'); document.getElementById(sections[tab.getAttribute('data-tab')]).style.display = 'block'; tabs.forEach(t=>t.classList.remove('active')); tab.classList.add('active'); }));
    document.getElementById('shopNowBtn')?.addEventListener('click', () => window.location.href = '/index.html');
    function logout() { localStorage.removeItem('droneToken'); window.location.href = '/login.html'; }
    document.getElementById('logoutBtn')?.addEventListener('click', logout);
    document.getElementById('logoutIcon')?.addEventListener('click', logout);
    loadDashboard();
</script>
</body>
</html>
